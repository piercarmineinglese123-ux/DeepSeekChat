<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101826">
<title>Chat DeepSeek</title>
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#16202e;--mute:#6b7788;--acc:#2f5bea;--line:#d9dfe9;--code:#0f1724;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d121a;--panel:#161d28;--ink:#e6ebf3;--mute:#8896ab;--acc:#6f93ff;--line:#263041}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
#log{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px}
.m{max-width:min(720px,92%);padding:10px 14px;border-radius:16px;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.a pre{background:var(--code);color:#e6edf7;padding:10px 12px;border-radius:10px;overflow-x:auto;font-size:13.5px;margin:8px 0}
.a code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.a :not(pre)>code{background:rgba(127,140,160,.18);padding:1px 5px;border-radius:5px}
.think{font-size:14px;color:var(--mute);border-left:3px solid var(--line);padding-left:10px;margin-bottom:8px;white-space:pre-wrap}
.err{color:#d6453d}
.meta{font-size:12px;color:var(--mute);margin-top:8px}
.code{margin:8px 0;border-radius:10px;overflow:hidden;background:var(--code)}
.code .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px;color:#9fb0c8;border-bottom:1px solid #223048}
.code .bar button{font-size:12.5px;padding:3px 9px;color:#e6edf7;border-color:#33445f;margin-left:4px}
.code pre{margin:0;border-radius:0}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:320px}
form{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,dialog textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0;background:var(--panel);border-top:1px solid var(--line)}
#chips:empty{display:none}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
small{color:var(--mute);display:block;margin-top:6px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;z-index:11;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#drawer.on{transform:none;visibility:visible;transition:transform .22s ease}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:17px}
#list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px}
#list li{display:flex;gap:6px}
#list .it{flex:1;min-width:0;text-align:left;padding:8px 12px}
#list .it span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .it small{margin:2px 0 0;font-size:12px}
#list li.cur .it{border-color:var(--acc)}
@media(prefers-reduced-motion:reduce){#scrim,#drawer{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Chat DeepSeek</h1>
  <button id="cfg" type="button">Impostazioni</button>
  <button id="menu" type="button" aria-label="Apri le chat" aria-expanded="false">☰</button>
</header>
<main id="log" aria-live="polite"></main>
<div id="chips"></div>
<form id="f">
  <button id="att" type="button" aria-label="Allega file">📎</button>
  <input id="file" type="file" multiple hidden>
  <textarea id="in" rows="1" placeholder="Scrivi un messaggio" aria-label="Messaggio"></textarea>
  <button id="send" class="primary" type="button">Invia</button>
</form>

<div id="scrim"></div>
<aside id="drawer" aria-label="Le tue chat" aria-hidden="true">
  <div class="dh"><b>Chat</b><button id="dclose" type="button" aria-label="Chiudi">✕</button></div>
  <button id="newc" class="primary" type="button">＋ Nuova chat</button>
  <ul id="list"></ul>
</aside>

<dialog id="dlg">
  <h2 style="margin:0 0 4px;font-size:18px">Impostazioni</h2>
  <label for="key">Chiave API DeepSeek</label>
  <input id="key" type="password" placeholder="sk-..." autocomplete="off">
  <small>Resta salvata solo in questo browser e viene inviata solo a api.deepseek.com.</small>
  <label for="model">Modello</label>
  <select id="model">
    <option value="deepseek-flash">deepseek-flash (veloce)</option>
    <option value="deepseek-v4-pro">deepseek-v4-pro (più potente)</option>
  </select>
  <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="think" type="checkbox" style="width:auto"> Mostra il ragionamento del modello</label>
  <label for="proxy">Indirizzo del proxy (https://...workers.dev)</label>
  <input id="proxy" type="url" placeholder="https://nome.tuo-account.workers.dev">
  <small>DeepSeek blocca le richieste dirette dal browser: serve un proxy. Vedi worker.js.</small>
  <label for="sys">Istruzioni di sistema (facoltative)</label>
  <textarea id="sys" rows="3" placeholder="Es. Rispondi sempre in italiano."></textarea>
  <div class="row"><button id="close" type="button">Annulla</button><button id="save" class="primary" type="button">Salva</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const titleOf=a=>{const u=a.find(m=>m.role==='user');return u?((u.display||u.content).replace(/\s+/g,' ').trim().slice(0,40)||'Nuova chat'):'Nuova chat'};
const live=new Map();
let chats=store.get('ds_chats',null),curId=store.get('ds_cur',null);
if(!Array.isArray(chats)||!chats.length){const old=store.get('ds_msgs',[]);chats=[{id:uid(),title:titleOf(old),msgs:old,updated:Date.now()}]}
if(!chats.some(c=>c.id===curId))curId=chats[0].id;
let msgs=chats.find(c=>c.id===curId).msgs;
let cfg=store.get('ds_cfg',{key:'',model:'deepseek-flash',sys:''});
if(!['deepseek-flash','deepseek-v4-pro'].includes(cfg.model))cfg.model='deepseek-flash';
let ctrl=null,rdr=null;
const HINT='Quando scrivi codice o un documento da salvare, mettilo in un blocco di codice con il linguaggio e il nome del file nella riga di apertura, ad esempio ```python app.py oppure ```csv dati.csv. Un blocco per file, con il contenuto completo e pronto da salvare.';

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const EXT={python:'py',py:'py',javascript:'js',js:'js',typescript:'ts',ts:'ts',html:'html',css:'css',json:'json',csv:'csv',markdown:'md',md:'md',bash:'sh',sh:'sh',shell:'sh',sql:'sql',java:'java',c:'c',cpp:'cpp',csharp:'cs',go:'go',rust:'rs',php:'php',ruby:'rb',xml:'xml',yaml:'yaml',yml:'yml',text:'txt',txt:'txt',latex:'tex'};
function codeBlock(p){
  const nl=p.indexOf('\n'),info=(nl>=0?p.slice(0,nl):p).trim().split(/\s+/).filter(Boolean),code=nl>=0?p.slice(nl+1):'';
  const lang=(info[0]||'').toLowerCase();
  const name=(info.find(t=>/\.\w+$/.test(t))||'codice.'+(EXT[lang]||'txt')).replace(/[^\w.\-]/g,'_');
  return '<div class="code" data-name="'+name+'"><div class="bar"><span>'+esc(name)+'</span><span><button type="button" data-act="copy">Copia</button><button type="button" data-act="dl">Scarica</button></span></div><pre><code>'+esc(code)+'</code></pre></div>';
}
function md(t){
  return t.split(/```/).map((p,i)=>{
    if(i%2)return codeBlock(p);
    return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
  }).join('');
}
function bubble(m){
  const d=document.createElement('div');
  d.className='m '+(m.role==='user'?'u':'a');
  paint(d,m);$('log').appendChild(d);return d;
}
function paint(d,m){
  if(m.role==='user'){d.textContent=m.display||m.content;(m.images||[]).forEach(u=>{const i=new Image();i.src=u;i.alt='Immagine allegata';i.style.cssText='display:block;max-width:100%;max-height:220px;border-radius:10px;margin-top:8px';d.appendChild(i)});return}
  d.innerHTML=(m.reasoning&&cfg.showThink?'<div class="think">'+esc(m.reasoning)+'</div>':'')+md(m.content||'')+(m.error?'<div class="err">'+esc(m.error)+'</div>':'')+(m.usage?'<div class="meta">Token: '+m.usage.prompt_tokens+' in ingresso · '+m.usage.completion_tokens+' in uscita · '+m.usage.total_tokens+' totali</div>':'');
}
function render(){
  const log=$('log');log.innerHTML='';
  if(!msgs.length){log.innerHTML='<div class="empty"><p><b>Pronto.</b></p><p>Inserisci la tua chiave API in Impostazioni, poi scrivi qui sotto.</p></div>'}
  msgs.forEach(bubble);log.scrollTop=log.scrollHeight;
}
function busy(b){$('send').textContent=b?'Stop':'Invia'}

async function ask(text,disp,imgs){
  if(!cfg.key){
    $('in').value=text;
    const d=document.createElement('div');d.className='m a err';
    d.textContent='Manca la chiave API. Inseriscila in Impostazioni e riprova.';
    $('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight;
    try{$('dlg').showModal()}catch{}
    return}
  const myId=curId,myMsgs=msgs;
  msgs.push({role:'user',content:text,display:disp,images:imgs||[]});
  const a={role:'assistant',content:'',reasoning:''};msgs.push(a);
  render();const el=$('log').lastChild;
  const payload=[{role:'system',content:[cfg.sys,HINT].filter(Boolean).join('\n\n')},...msgs.slice(0,-1).filter(m=>!m.error).map(m=>({role:m.role,content:m.images&&m.images.length?[{type:'text',text:m.content},...m.images.map(u=>({type:'image_url',image_url:{url:u}}))]:m.content}))];
  ctrl={stopped:false,abort(){this.stopped=true;try{rdr&&rdr.cancel()}catch{}}};busy(true);
  try{
    const r=await fetch(cfg.proxy||'https://api.deepseek.com/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body:JSON.stringify({model:cfg.model,messages:payload,stream:true,stream_options:{include_usage:true}})});
    if(!r.ok){let e='';try{e=(await r.json()).error.message}catch{}throw new Error('Errore '+r.status+(e?': '+e:''))}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';rdr=rd;
    for(;;){
      if(ctrl.stopped){try{rd.cancel()}catch{}break}
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const l of lines){
        if(!l.startsWith('data:'))continue;
        const s=l.slice(5).trim();if(!s||s==='[DONE]')continue;
        try{const j=JSON.parse(s);if(j.usage)a.usage=j.usage;const dl=j.choices&&j.choices[0]&&j.choices[0].delta;if(dl){if(dl.content)a.content+=dl.content;if(dl.reasoning_content)a.reasoning+=dl.reasoning_content}}catch{}
        paint(el,a);$('log').scrollTop=$('log').scrollHeight;
      }
    }
  }catch(e){
    if(e.name!=='AbortError'){a.error=e.message==='Failed to fetch'?'Connessione fallita. DeepSeek blocca le richieste dirette dal browser: imposta l\'indirizzo del proxy in Impostazioni.':e.message}
    paint(el,a);
  }
  if(!a.content&&!a.error&&!a.reasoning){myMsgs.pop();myMsgs.pop();}
  ctrl=null;busy(false);persist(myId,myMsgs);
}

let pend=[];
function drawChips(){
  const c=$('chips');c.innerHTML='';
  pend.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=f.name+' ✕';b.setAttribute('aria-label','Rimuovi '+f.name);b.onclick=()=>{pend.splice(i,1);drawChips()};c.appendChild(b)});
}
$('log').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const box=b.closest('.code'),text=box.querySelector('code').textContent;
  if(b.dataset.act==='copy'){
    navigator.clipboard.writeText(text).then(()=>{b.textContent='Copiato';setTimeout(()=>b.textContent='Copia',1500)}).catch(()=>{});
  }else{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
    a.download=box.dataset.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
});
$('att').onclick=()=>$('file').click();
const CDN='https://cdnjs.cloudflare.com/ajax/libs/',libs={};
function loadScript(src){return libs[src]||(libs[src]=new Promise((ok,ko)=>{const t=document.createElement('script');t.src=src;t.onload=ok;t.onerror=()=>ko(new Error('libreria non caricata (serve internet)'));document.head.appendChild(t)}))}
function dataUrl(f){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ko;r.readAsDataURL(f)})}
async function imgUrl(f){
  if(f.type==='image/gif')return dataUrl(f);
  try{
    const b=await createImageBitmap(f),k=Math.min(1,2048/Math.max(b.width,b.height));
    const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.9);
  }catch{return dataUrl(f)}
}
async function readPdf(f){
  await loadScript(CDN+'pdf.js/3.11.174/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+'pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  let text='';
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),c=await pg.getTextContent();text+='\n--- Pagina '+i+' ---\n'+c.items.map(t=>t.str).join(' ')}
  if(text.replace(/--- Pagina \d+ ---|\s/g,'').length>50)return{text};
  const urls=[];
  for(let i=1;i<=Math.min(pdf.numPages,10);i++){
    const pg=await pdf.getPage(i),v=pg.getViewport({scale:1.5}),c=document.createElement('canvas');
    c.width=v.width;c.height=v.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    urls.push(c.toDataURL('image/jpeg',0.85));
  }
  return{urls};
}
async function readFiles(files){
  for(const f of files){
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(f.size>50*1024*1024){alert(f.name+' è troppo grande (massimo 50 MB).');continue}
    try{
      let r;
      if(f.type.startsWith('image/'))r={urls:[await imgUrl(f)]};
      else if(ext==='pdf')r=await readPdf(f);
      else if(ext==='docx'){
        await loadScript(CDN+'mammoth/1.6.0/mammoth.browser.min.js');
        r={text:(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value};
      }else if(['xlsx','xls','xlsm','ods'].includes(ext)){
        await loadScript(CDN+'xlsx/0.18.5/xlsx.full.min.js');
        const wb=XLSX.read(await f.arrayBuffer());
        r={text:wb.SheetNames.map(n=>'## Foglio '+n+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n')};
      }else{
        const text=await f.text();
        if(text.includes('\u0000'))throw new Error('formato non supportato');
        r={text};
      }
      if(r.text!==undefined){
        if(r.text.length>3e6&&!confirm(f.name+' ha più di 3 milioni di caratteri: il modello potrebbe rifiutarlo perché troppo lungo. Allegarlo comunque?'))continue;
        pend.push({name:f.name,text:r.text});
      }else r.urls.forEach((u,i)=>pend.push({name:f.name+(r.urls.length>1?' p.'+(i+1):''),url:u}));
    }catch(err){alert('Impossibile leggere '+f.name+': '+err.message)}
  }
}
$('file').onchange=async e=>{
  $('att').textContent='⏳';
  await readFiles(e.target.files);
  e.target.value='';$('att').textContent='📎';drawChips();
};
function go(){
  if(ctrl){ctrl.abort();return}
  const t=$('in').value.trim();if(!t&&!pend.length)return;
  if(!cfg.key){try{$('dlg').showModal()}catch{}return}
  let full=t,disp=t;
  const imgs=pend.filter(f=>f.url).map(f=>f.url),docs=pend.filter(f=>!f.url);
  if(imgs.length&&cfg.model!=='deepseek-flash'){alert('Le immagini funzionano solo con il modello deepseek-flash. Cambialo in Impostazioni.');return}
  if(docs.length){
    full+=docs.map(f=>'\n\n[File: '+f.name+']\n```\n'+f.text+'\n```').join('');
    disp+=(t?'\n':'')+docs.map(f=>'📎 '+f.name).join('\n');
  }
  if(!full){full='Descrivi le immagini allegate.';disp=full}
  pend=[];drawChips();
  $('in').value='';$('in').style.height='';
  ask(full,disp,imgs).catch(e=>{const d=document.createElement('div');d.className='m a err';d.textContent='Errore: '+e.message;$('log').appendChild(d);busy(false);ctrl=null});
}
$('f').addEventListener('submit',e=>{e.preventDefault();go()});
$('send').addEventListener('click',go);
$('in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();go()}});
function persist(id,arr){
  const c=chats.find(x=>x.id===id);if(!c)return;
  live.set(id,arr);
  c.msgs=arr.filter(m=>!m.error).map(m=>{m={...m,images:undefined};return m.content&&m.content.length>200000?{...m,content:m.display||'[file omesso]'}:m});
  c.title=titleOf(c.msgs);c.updated=Date.now();save();
}
function save(){store.set('ds_chats',chats);store.set('ds_cur',curId)}
const len=c=>(live.get(c.id)||c.msgs).length;
function drawer(on){
  $('drawer').classList.toggle('on',on);$('scrim').classList.toggle('on',on);
  $('drawer').setAttribute('aria-hidden',String(!on));$('menu').setAttribute('aria-expanded',String(on));
  if(on){drawChats();$('dclose').focus()}else $('menu').focus();
}
function drawChats(){
  const ul=$('list');ul.innerHTML='';
  [...chats].sort((a,b)=>b.updated-a.updated).forEach(c=>{
    const li=document.createElement('li');if(c.id===curId)li.className='cur';
    const b=document.createElement('button');b.type='button';b.className='it';
    const t=document.createElement('span');t.textContent=c.title;
    const d=document.createElement('small');d.textContent=new Date(c.updated).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    b.append(t,d);b.onclick=()=>openChat(c.id);
    const x=document.createElement('button');x.type='button';x.textContent='✕';x.setAttribute('aria-label','Elimina chat: '+c.title);x.onclick=()=>delChat(c.id);
    li.append(b,x);ul.appendChild(li);
  });
}
function newChat(){
  if(ctrl)ctrl.abort();
  const cur=chats.find(c=>c.id===curId);
  if(!cur||len(cur)){
    const c={id:uid(),title:'Nuova chat',msgs:[],updated:Date.now()};
    chats.unshift(c);curId=c.id;msgs=c.msgs;
    chats=chats.filter(x=>x.id===curId||len(x));
    save();render();
  }
  drawer(false);$('in').focus();
}
function openChat(id){
  if(id!==curId){
    const c=chats.find(x=>x.id===id);if(!c)return;
    if(ctrl)ctrl.abort();
    curId=id;msgs=live.get(id)||c.msgs;
    chats=chats.filter(x=>x.id===curId||len(x));
    save();render();
  }
  drawer(false);
}
function delChat(id){
  if(!confirm('Eliminare questa chat?'))return;
  if(id===curId&&ctrl)ctrl.abort();
  chats=chats.filter(c=>c.id!==id);live.delete(id);
  if(!chats.length)chats=[{id:uid(),title:'Nuova chat',msgs:[],updated:Date.now()}];
  if(id===curId){
    curId=[...chats].sort((a,b)=>b.updated-a.updated)[0].id;
    msgs=live.get(curId)||chats.find(c=>c.id===curId).msgs;render();
  }
  save();drawChats();
}
$('menu').onclick=()=>drawer(true);
$('dclose').onclick=()=>drawer(false);
$('scrim').onclick=()=>drawer(false);
$('newc').onclick=newChat;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('drawer').classList.contains('on'))drawer(false)});
$('cfg').onclick=()=>{$('key').value=cfg.key;$('proxy').value=cfg.proxy||'';$('think').checked=!!cfg.showThink;$('model').value=cfg.model;$('sys').value=cfg.sys;$('dlg').showModal()};
$('close').onclick=()=>$('dlg').close();
$('save').onclick=()=>{cfg={proxy:$('proxy').value.trim(),key:$('key').value.trim(),model:$('model').value,sys:$('sys').value.trim(),showThink:$('think').checked};store.set('ds_cfg',cfg);$('dlg').close();render()};
render();
if(!cfg.key)setTimeout(()=>$('cfg').click(),300);
</script>
